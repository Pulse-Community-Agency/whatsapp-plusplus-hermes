stages:
  - test
  - build
  - publish

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  key:
    files:
      - pyproject.toml
  paths:
    - .uv-cache/

lint-package:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  script:
    - python -m py_compile src/pulse_labs_whatsapp_plusplus_hermes/*.py src/wpp_hermes_cli/*.py scripts/install.py
    - uv build
    - WHEEL="$(ls dist/wpp_hermes-*.whl)"
    - env -u PYTHONPATH uvx --isolated --from "$WHEEL" wpp-hermes --help
    - env -u PYTHONPATH uvx --isolated --from "$WHEEL" wpp-hermes --version
    - env -u PYTHONPATH uvx --isolated --from "$WHEEL" whatsapp-plusplus --help
    - env -u PYTHONPATH uvx --isolated --from "$WHEEL" wpp-hermes install --help
    - env -u PYTHONPATH uvx --isolated --from "$WHEEL" wpp-hermes doctor --hermes-home /tmp/wpp-hermes-empty-home
    - env -u PYTHONPATH uvx --isolated --from "$WHEEL" wpp-hermes-install --help

build-package:
  stage: build
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  script:
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

publish-testpypi:
  stage: publish
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  needs:
    - job: build-package
      artifacts: true
  environment:
    name: testpypi
  id_tokens:
    TESTPYPI_ID_TOKEN:
      aud: testpypi
  script:
    - uv publish --publish-url https://test.pypi.org/legacy/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$/'
      when: manual
    - when: never

publish-pypi:
  stage: publish
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  needs:
    - job: build-package
      artifacts: true
  environment:
    name: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - uv publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
    - when: never
